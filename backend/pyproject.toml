[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "transcriptor"
version = "0.1.0"
description = "Audio transcription service with WhisperX + speaker diarization, plus CLI for local and remote use."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
client = [
    "typer>=0.12",
    "httpx>=0.27",
    "rich>=13",
    "tomli>=2.0;python_version<'3.11'",
]
full = [
    "transcriptor[client]",
    "fastapi==0.109.2",
    "uvicorn[standard]==0.27.1",
    "python-multipart==0.0.9",
    "pydantic==2.6.1",
    "pydantic-settings==2.2.1",
    "sqlalchemy==2.0.25",
    "whisperx @ git+https://github.com/m-bain/whisperx.git",
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "python-dotenv==1.0.1",
]
dev = [
    "pytest>=7.0.0,<8.0.0",
    "pytest-asyncio==0.23.4",
    "respx>=0.20",
]

[project.scripts]
transcriptor = "src.cli.app:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests that take more than a few seconds (deselect with -m 'not slow')",
]
